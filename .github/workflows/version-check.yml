# Based on: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries
name: Version Check
on: {pull_request: {branches: [main]}}
permissions:
  contents: read
jobs:
  version-check:
    name: Version Check
    runs-on: ubuntu-latest
    steps:
      - {name: Checkout repo, uses: actions/checkout@v4}
      - {name: Install python, uses: actions/setup-python@v5, with: {python-version: '3.x'}}
      - {name: Install dependencies, run: "pip install GitPython packaging PyGithub requests toml"}
      - {name: Check version, run: "python make.py version_check"}
