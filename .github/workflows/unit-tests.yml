# Based on: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries
name: Unit Tests
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  workflow_dispatch: # allow manual runs, e.g. to refresh the README badge
  schedule: [{cron: "0 4 1 * *"}] # monthly, so runs never age out of GitHub's 90d retention
permissions:
  contents: read
jobs:
  unit-tests:
    name: "${{ matrix.os }} / py${{ matrix.python-version }}"
    runs-on: "${{ matrix.os }}"
    defaults: {run: {shell: bash}} # bash on Windows too, so that `dist/*.whl` globbing works everywhere
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep in sync with requires-python and the classifiers in pyproject.toml
          - {os: ubuntu-latest, python-version: '3.10'}
          - {os: ubuntu-latest, python-version: '3.11'}
          - {os: ubuntu-latest, python-version: '3.12', coverage: true}
          - {os: ubuntu-latest, python-version: '3.13'}
          - {os: ubuntu-latest, python-version: '3.14'}
          - {os: macos-latest, python-version: '3.10'}
          - {os: macos-latest, python-version: '3.14'}
          - {os: windows-latest, python-version: '3.10'}
          - {os: windows-latest, python-version: '3.14'}
    steps:
      - {name: Checkout repo, uses: actions/checkout@v5}
      - {name: Install python, uses: actions/setup-python@v6, with: {python-version: "${{ matrix.python-version }}"}}
      - {name: Install build tooling, run: "python -m pip install --upgrade pip build"}
      - {name: Build adadmire, run: "python -m build"}
      - {name: Install adadmire, run: "pip install ./dist/*.whl"}
      - {name: Install test dependencies, run: "pip install pytest pytest-cov pytest-xdist"}
      - {name: Run pytest, run: "pytest --runslow --cov=adadmire --cov-report=xml -n 4"}
      - name: Upload coverage
        if: matrix.coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: "${{ secrets.CODECOV_TOKEN }}"
          fail_ci_if_error: false
  keepalive:
    # GitHub disables scheduled workflows after 60 days without repository
    # activity. Re-enabling the workflow on every scheduled run resets that
    # timer, so the monthly runs keep going even when nothing is committed.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/unit-tests.yml/enable"
        env: {GH_TOKEN: "${{ github.token }}"}
