# Based on: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries
name: Unit Tests
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  workflow_dispatch: # allow manual runs, e.g. to refresh the README badge
  schedule: [{cron: "0 4 1 * *"}] # monthly, so runs never age out of GitHub's 90d retention
permissions:
  contents: read
jobs:
  unit-tests:
    name: "${{ matrix.os }} / py${{ matrix.python-version }}"
    runs-on: "${{ matrix.os }}"
    defaults: {run: {shell: bash}} # bash on Windows too, so that `dist/*.whl` globbing works everywhere
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: '3.9'}
          - {os: ubuntu-latest, python-version: '3.10'}
          - {os: ubuntu-latest, python-version: '3.11'}
          - {os: ubuntu-latest, python-version: '3.12', coverage: true}
          - {os: ubuntu-latest, python-version: '3.13'}
          - {os: macos-latest, python-version: '3.11'}
          - {os: macos-latest, python-version: '3.13'}
          - {os: windows-latest, python-version: '3.11'}
          - {os: windows-latest, python-version: '3.13'}
    steps:
      - {name: Checkout repo, uses: actions/checkout@v4}
      - {name: Install python, uses: actions/setup-python@v5, with: {python-version: "${{ matrix.python-version }}"}}
      - {name: Install build tooling, run: "python -m pip install --upgrade pip build"}
      - {name: Build adadmire, run: "python -m build"}
      - {name: Install adadmire, run: "pip install ./dist/*.whl"}
      - {name: Install test dependencies, run: "pip install pytest pytest-cov pytest-xdist"}
      - {name: Run pytest, run: "pytest --runslow --cov=adadmire --cov-report=xml -n 4"}
      - name: Upload coverage
        if: matrix.coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: "${{ secrets.CODECOV_TOKEN }}"
          fail_ci_if_error: false
