name: PyPI Release
on:
  push: {branches: [main]}
  workflow_dispatch:
env:
  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
  TWINE_USERNAME: "${{ secrets.TWINE_USERNAME }}"
  TWINE_PASSWORD: "${{ secrets.TWINE_PASSWORD }}"
permissions:
  contents: read
jobs:
  pypi-release:
    name: PyPI Release
    runs-on: ubuntu-latest
    environment: # records a deployment, so that github.com/spang-lab/adadmire/deployments/pypi stays up to date
      name: pypi
      url: https://pypi.org/p/adadmire
    steps:
      - {name: Checkout repo,   uses: actions/checkout@v5, with: {fetch-depth: 0}}
      - {name: Setup python,    uses: actions/setup-python@v6, with: {python-version: '3.x'}}
      - {name: Install deps,    run: "pip install -r make_requirements.txt"}
      - {name: Publish to PyPI, run: "python make.py pypi_release"}
